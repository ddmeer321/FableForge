name: FableForge auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Statische Spielversion bauen
        run: npm run build:pages

      - name: Spielpaket hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
